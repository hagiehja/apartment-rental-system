server:
  port: 8088
  tomcat:
    threads:
      max: 500         # 默认 200，提升至 500 支撑高并发
      min-spare: 50    # 保持 50 个线程预热，减少线程创建延迟
    accept-count: 500  # 队列长度，防止 connection refused

spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  application:
    name: apartment-order-service
  datasource:
    url: jdbc:mysql://localhost:3306/apartment_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50        # 核心优化：从 10 提升到 50，消除连接池瓶颈
      minimum-idle: 20             # 保持 20 个空闲连接，减少连接创建开销
      connection-timeout: 10000    # 获取连接超时 10 秒
      idle-timeout: 300000         # 空闲连接 5 分钟回收
      max-lifetime: 1200000        # 连接最大生命周期 20 分钟
      pool-name: OrderHikariPool

mybatis-plus:
  type-aliases-package: com.example.order.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 关闭 SQL 控制台日志打印：这是影响性能的最大单因素之一
    # 压测期间每条 SQL 都打印到控制台，会严重降低吞吐量

logging:
  level:
    # 压测时将 DEBUG 改为 WARN，减少日志 I/O 开销
    com.example.order: warn
    org.springframework: warn

# Redis配置
spring.data.redis:
  host: 192.168.24.129
  port: 6379
  database: 1
  timeout: 3000ms
  lettuce:
    pool:
      max-active: 50    # 提升 Lettuce 连接池
      max-idle: 20
      min-idle: 10
      max-wait: 5000ms

# Redisson配置
spring.redisson:
  config: |
    singleServerConfig:
      address: "redis://192.168.24.129:6379"
      database: 1
      connectionPoolSize: 128     # 提升 Redisson 连接池，支撑高并发锁操作
      connectionMinimumIdleSize: 32
      timeout: 3000

rocketmq:
  name-server: 192.168.24.129:9876
  producer:
    group: order-service-producer-group
