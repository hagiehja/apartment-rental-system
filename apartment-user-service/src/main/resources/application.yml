jwt:
  # [VULN-09 修复] 不再硬编码默认密钥, 必须由 env JWT_SECRET 提供
  # 生产: openssl rand -base64 48 生成, 写入 .env.app 或 K8s Secret
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.24.129}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:apartment_db}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

mybatis-plus:
  type-aliases-package: com.example.user.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      
server:
  port: ${SERVER_PORT:8081}
  
logging:
  level:
    com.example.user: debug
    org.springframework: info

# Redis配置
spring.data.redis:
  sentinel:
    master: mymaster
    nodes: 192.168.24.129:26379,192.168.24.129:26380,192.168.24.129:26381
    password: ${REDIS_PASSWORD:ApmtRedis2026Secure!}
  password: ${REDIS_PASSWORD:ApmtRedis2026Secure!}
  database: 0  # 用户服务使用database 0
  timeout: 3000ms
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 0
      max-wait: -1ms

# Redisson配置
spring.redisson:
  config: |
    sentinelConfig:
      masterName: mymaster
      sentinelAddresses:
        - "redis://192.168.24.129:26379"
        - "redis://192.168.24.129:26380"
        - "redis://192.168.24.129:26381"
      sentinelPassword: ${REDIS_PASSWORD:ApmtRedis2026Secure!}
      password: ${REDIS_PASSWORD:ApmtRedis2026Secure!}
      database: 0
      connectionPoolSize: 64
      connectionMinimumIdleSize: 10
      timeout: 3000
---
# ============ [L0 容灾] 健康检查端点(供 Docker/Nginx 探活与自愈) ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # 暴露 /actuator/health/liveness 与 /readiness
# ============ [L0 容灾] Sentinel 熔断/降级/限流 控制台接入 ============
spring:
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.24.129:8858}
      eager: true       # 启动即连接控制台,而非首次访问才注册
