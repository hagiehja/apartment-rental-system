# ========================================
# 配置 5: apartment-contract-service.yaml
# Data ID: apartment-contract-service.yaml
# Group: DEFAULT_GROUP
# ========================================
server:
  port: 8092

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/apartment_contract?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.contract.entity

# 合同文件存储配置
contract:
  file:
    base-path: D:/apartment/contracts

# 服务地址（使用Nacos服务名，而非硬编码URL）
order:
  service:
    url: http://apartment-order-service

notification:
  service:
    url: http://apartment-notice-service

logging:
  level:
    com.example.contract: debug

