# 配置 6: apartment-notice-service.yaml
# Data ID: apartment-notice-service.yaml
# Group: DEFAULT_GROUP
# ========================================
server:
  port: 8091

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/apartment_notification?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# RocketMQ配置
rocketmq:
  name-server: 192.168.124.29:9876
  producer:
    group: notification-producer-group
    send-message-timeout: 3000
    max-message-size: 4194304
    retry-times-when-send-failed: 2
  consumer:
    group: notification-consumer-group

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.notification.entity

logging:
  level:
    com.example.notification: debug
    org.apache.rocketmq: info

# ========================================
# 配置 7: apartment-gateway.yaml
# Data ID: apartment-gateway.yaml
# Group: DEFAULT_GROUP
# ========================================
server:
  port: 8080

spring:
  cloud:
    gateway:
      # 全局CORS配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      # 启用服务发现路由
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      
      # 路由配置（使用 lb:// 负载均衡方式）
      routes:
        - id: user-service
          uri: lb://apartment-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        
        - id: house-service
          uri: lb://apartment-house-service
          predicates:
            - Path=/api/house/**
          filters:
            - StripPrefix=1
        
        - id: order-service
          uri: lb://apartment-order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        
        - id: payment-service
          uri: lb://apartment-payment-service
          predicates:
            - Path=/api/payment/**,/api/account/**
          filters:
            - StripPrefix=1
        
        - id: notification-service
          uri: lb://apartment-notice-service
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=1
        
        - id: contract-service
          uri: lb://apartment-contract-service
          predicates:
            - Path=/api/contract/**
          filters:
            - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
