# ========================================
# Nacos 配置文件集合
# 将以下每个配置复制到 Nacos 控制台
# ========================================

# ========================================
# 配置 1: apartment-user-service.yaml
# Data ID: apartment-user-service.yaml
# Group: DEFAULT_GROUP
# ========================================
server:
  port: 8081

spring:
  main:
  datasource:
    url: jdbc:mysql://localhost:3306/apartment_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  data:
    redis:
      host: 192.168.24.129
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  type-aliases-package: com.example.user.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt:
  secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb25NdXN0QmVBdExlYXN0MzJDaGFyYWN0ZXJzTG9uZw==
  expiration-ms: 3600000

# Redisson配置
spring.redisson:
  config: |
    singleServerConfig:
      address: "redis://192.168.24.129:6379"
      database: 0
      connectionPoolSize: 64
      connectionMinimumIdleSize: 10
      timeout: 3000

logging:
  level:
    com.example.user: debug
    org.springframework: info

