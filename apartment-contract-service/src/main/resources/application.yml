server:
  port: 8092

spring:
  application:
    name: apartment-contract-service
  datasource:
    url: jdbc:mysql://localhost:3306/apartment_contract?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 打印 SQL 日志(开发环境)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.contract.entity

# 合同文件存储配置
contract:
  file:
    # Windows环境
    base-path: C:/Users/Zz/apartment-rental-system/contracts
    # Linux/Mac环境可使用: /var/apartment/contracts

# 订单服务地址
order:
  service:
    url: http://localhost:8083

# 通知服务地址
notification:
  service:
    url: http://localhost:8091

rocketmq:
  name-server: 192.168.24.129:9876
  producer:
    group: contract-service-producer-group

# 日志配置
logging:
  level:
    com.example.contract: debug

