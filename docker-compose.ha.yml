name: apartment-ha

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile.service
  env_file:
    - .env.app
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT:-8080}/actuator/health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 60s

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - apartment-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 3

  apartment-gateway:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: apartment-gateway
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"
    depends_on:
      - apartment-user-service
      - apartment-house-service
      - apartment-order-service
      - apartment-payment-service
      - apartment-notice-service
      - apartment-contract-service

  apartment-user-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: apartment-user-service
    environment:
      SERVER_PORT: "8081"
    expose:
      - "8081"

  apartment-house-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: apartment-house-service
    environment:
      SERVER_PORT: "8083"
    expose:
      - "8083"

  apartment-order-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: apartment-order-service
    environment:
      SERVER_PORT: "8088"
    expose:
      - "8088"

  apartment-payment-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: apartment-payment-service
    environment:
      SERVER_PORT: "8087"
    expose:
      - "8087"

  apartment-notice-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: apartment-notice-service
    environment:
      SERVER_PORT: "8091"
    expose:
      - "8091"

  apartment-contract-service:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: apartment-contract-service
    environment:
      SERVER_PORT: "8092"
    expose:
      - "8092"
    volumes:
      - contract-files:/data/apartment/contracts

volumes:
  contract-files:
