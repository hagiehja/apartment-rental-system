server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: apartment-gateway
  cloud:
    gateway:
      # ============ [L0 容灾] 网关超时(防慢调用拖垮下游) ============
      httpclient:
        connect-timeout: 2000      # TCP 连接超时 2s
        response-timeout: 10s      # 整体响应超时 10s
      # ============ [L0 容灾] 默认重试(仅对幂等 GET + 5xx,POST 不重试避免重复下单) ============
      default-filters:
        - name: Retry
          args:
            retries: 3
            series: SERVER_ERROR
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
            methods: GET
            exceptions: java.io.IOException, java.util.concurrent.TimeoutException
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false
        - name: RequestSize
          args:
            maxSize: 10MB
      # 全局CORS配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      # 路由配置
      routes:
        # ========================================
        # 用户服务路由 (端口: 8081)
        # ========================================
        - id: user-service
          uri: lb://apartment-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        
        # ========================================
        # 房源服务路由 (端口: 8083)
        # ========================================
        - id: house-service
          uri: lb://apartment-house-service
          predicates:
            - Path=/api/house/**
          filters:
            - StripPrefix=1
        
        # ========================================
        # 订单服务路由 (端口: 8088)
        # ========================================
        - id: order-service
          uri: lb://apartment-order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        
        # ========================================
        # 支付服务路由 (端口: 8087)
        # ========================================
        - id: payment-service
          uri: lb://apartment-payment-service
          predicates:
            - Path=/api/payment/**,/api/account/**
          filters:
            - StripPrefix=1
        
        # ========================================
        # 通知服务路由 (端口: 8091)
        # ========================================
        - id: notification-service
          uri: lb://apartment-notice-service
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=1
        
        # ========================================
        # 合同服务路由 (端口: 8092)
        # ========================================
        - id: contract-service
          uri: lb://apartment-contract-service
          predicates:
            - Path=/api/contract/**
          filters:
            - StripPrefix=1

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

# 网关信息
gateway:
  info:
    version: 1.0.0
    description: 公寓租赁系统API网关
    services:
      - name: user-service
        port: 8081
        paths: /api/user/**
      - name: house-service
        port: 8083
        paths: /api/house/**
      - name: order-service
        port: 8088
        paths: /api/order/**
      - name: payment-service
        port: 8087
        paths: /api/payment/**, /api/account/**
      - name: notification-service
        port: 8091
        paths: /api/notification/**
      - name: contract-service
        port: 8092
        paths: /api/contract/**
---
# ============ [L0 容灾] 健康检查端点(供 Docker/Nginx 探活与自愈) ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # 暴露 /actuator/health/liveness 与 /readiness
