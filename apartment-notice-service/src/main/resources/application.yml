server:
  port: 8091

spring:
  application:
    name: apartment-notice-service
  datasource:
    url: jdbc:mysql://localhost:3306/apartment_notification?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# RocketMQ 配置
rocketmq:
  name-server: 192.168.24.129:9876
  producer:
    group: notification-producer-group
    send-message-timeout: 3000
    # 消息最大大小 4MB
    max-message-size: 4194304
    # 发送失败重试次数
    retry-times-when-send-failed: 2
  consumer:
    group: notification-consumer-group

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 打印 SQL 日志(开发环境)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.notification.entity

# 日志配置
logging:
  level:
    com.example.notification: debug
    org.apache.rocketmq: info
