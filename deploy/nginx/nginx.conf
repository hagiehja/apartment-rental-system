worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" "$request_time"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # ============ [VULN-04 修复] 速率限制 ============
    # 登录接口: 5 req/s/IP, 突发10 (防暴力破解)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
    # 注册接口: 2 req/s/IP (防批量注册)
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=2r/s;
    # 全局: 单IP 50 req/s (防爬虫/CC)
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=50r/s;
    limit_req_status 429;

    # ============ 上游:网关池 (保持长连接降低P99) ============
    upstream gateway_backend {
        server apartment-gateway:8080;
        keepalive 256;
    }

    server {
        listen 80;
        server_name _;

        # ============ 健康检查 (无需鉴权) ============
        location = /health {
            add_header Content-Type text/plain;
            return 200 "nginx ok\n";
        }

        # ============ 图片代理 (无需鉴权) ============
        location /img/ {
            set $img_upstream apartment-ha-image-proxy-1:8088;
            proxy_pass http://$img_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # ============ 运维总览页面 (内网,无需鉴权) ============
        location = /ops {
            root /usr/share/nginx/html;
            try_files /ops/index.html =404;
            add_header Cache-Control "no-store";
        }
        location /ops/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "no-store";
        }
        location ~ ^/ops/health/(gateway|user|house|order|payment|notice|contract)$ {
            set $svc "";
            if ($request_uri ~ /ops/health/(gateway|user|house|order|payment|notice|contract)) { set $svc $1; }
            set $target apartment-gateway:8080;
            if ($svc = "user")      { set $target apartment-user-service:8081; }
            if ($svc = "house")     { set $target apartment-house-service:8083; }
            if ($svc = "order")     { set $target apartment-order-service:8088; }
            if ($svc = "payment")   { set $target apartment-payment-service:8087; }
            if ($svc = "notice")    { set $target apartment-notice-service:8091; }
            if ($svc = "contract")  { set $target apartment-contract-service:8092; }
            proxy_pass http://$target/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }
        location /ops/prom {
            resolver 127.0.0.11 valid=30s;
            set $prom_backend prometheus:9090;
            proxy_pass http://$prom_backend/api/v1/query;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location = /gateway/health {
            proxy_pass http://gateway_backend/gateway/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============ 登录接口 (防暴力破解 5r/s) ============
        location = /api/user/login {
            limit_req zone=login_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header X-User-Id "";
        }

        # ============ 注册接口 (防批量注册 2r/s) ============
        location = /api/user/register {
            limit_req zone=register_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header X-User-Id "";
        }

        # ============ 公开 API (白名单,无需JWT) ============
        # 统计/健康检查/房源列表/房源详情/批量查房东信息
        location ~ ^/(api/user/(health|stats|batch)|api/house/(list|detail|health|cities|search)) {
            limit_req zone=global_limit burst=100 nodelay;
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # 关键:清空客户端可能发送的X-User-Id,防止在公开接口上伪造身份
            proxy_set_header X-User-Id "";
        }

        # ============ 受保护 API (需要JWT,自动注入X-User-Id) ============
        location / {
            limit_req zone=global_limit burst=100 nodelay;
            auth_request /_jwt_verify;
            # 从jwt-auth响应中捕获认证后的userId
            auth_request_set $jwt_user_id $upstream_http_x_auth_user_id;
            # 认证失败时的处理 (返回401 JSON)
            error_page 401 = @auth_unauthorized;

            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # 关键:无论客户端发什么X-User-Id,都覆盖为JWT解析出的真实userId
            proxy_set_header X-User-Id $jwt_user_id;
        }

        # ============ 401 返回标准JSON ============
        location @auth_unauthorized {
            default_type application/json;
            return 401 '{"code":401,"message":"未授权或Token已过期,请重新登录","data":null}';
        }

        # ============ 429 返回标准JSON ============
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After "2";
            return 429 '{"code":429,"message":"请求过于频繁,请稍后再试","data":null}';
        }

        # ============ JWT 鉴权子请求 (内部location) ============
        location = /_jwt_verify {
            internal;
            resolver 127.0.0.11 valid=30s;
            set $jwt_backend jwt-auth:8089;
            proxy_pass http://$jwt_backend/verify;
            proxy_http_version 1.1;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }
    }
}