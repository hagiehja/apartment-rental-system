server {
    listen 80;
    server_name _;

    # docker 内置 DNS,运行时动态解析(避免主 nginx 重建 IP 变化后启动缓存失效 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vue SPA 静态文件 (history 路由模式)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 代理到主 nginx (经过 JWT 鉴权 + 限流)
    # 用变量+resolver 动态解析,主 nginx 容器重建后自动跟上新 IP
    location /api/ {
        set $api_backend nginx;
        proxy_pass http://$api_backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 图片代理
    location /img/ {
        set $img_backend nginx;
        proxy_pass http://$img_backend:80;
        proxy_set_header Host $host;
    }
}
