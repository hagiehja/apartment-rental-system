global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'apartment-monitor'

scrape_configs:
  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 七个应用通过 Compose 服务 DNS 暴露 Micrometer 指标
  - job_name: 'apartment-apps'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'apartment-gateway:8080'
          - 'apartment-user-service:8081'
          - 'apartment-house-service:8083'
          - 'apartment-order-service:8088'
          - 'apartment-payment-service:8087'
          - 'apartment-notice-service:8091'
          - 'apartment-contract-service:8092'
