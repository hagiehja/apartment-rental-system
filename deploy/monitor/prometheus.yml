global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'apartment-monitor'

scrape_configs:
  # ============ 基础设施指标(轨道A,立即可用) ============
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 主机指标:VM 的 CPU / 内存 / 磁盘 / 网络
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 容器指标:每个容器的 CPU / 内存 / 网络吞吐
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ============ 应用指标(轨道B,应用镜像加 micrometer 后启用) ============
  - job_name: 'apartment-apps'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'apartment-ha-apartment-gateway-1:8080'
          - 'apartment-ha-apartment-user-service-1:8081'
          - 'apartment-ha-apartment-house-service-1:8083'
          - 'apartment-ha-apartment-order-service-1:8088'
          - 'apartment-ha-apartment-payment-service-1:8087'
          - 'apartment-ha-apartment-notice-service-1:8091'
          - 'apartment-ha-apartment-contract-service-1:8092'
