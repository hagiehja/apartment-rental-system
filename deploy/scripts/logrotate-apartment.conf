# =====================================================================
# 智慧公寓租赁系统 - logrotate 配置
# 防止 Docker 容器日志 / 中间件日志把磁盘吃满 (上次磁盘使用率到 96%)
# 
# 安装方法 (在宿主机 192.168.24.129 上以 root 执行):
#   sudo cp logrotate-apartment.conf /etc/logrotate.d/apartment
#   sudo logrotate -d /etc/logrotate.d/apartment   # dry-run 测试
#   sudo logrotate -f /etc/logrotate.d/apartment   # 立即强制执行一次
#   
# cron 自动执行: Ubuntu/CentOS 默认 /etc/cron.daily/logrotate 会调用
# 如需更频繁 (每小时): 把配置软链到 /etc/cron.hourly/
# =====================================================================

# ---------- 1. Docker 容器 stdout/stderr 日志 (json-file driver) ----------
# 这是最大的日志来源, 一个高并发服务一天能写几 GB
/var/lib/docker/containers/*/*.log {
    daily
    rotate 5
    size 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate           # 关键: 不重启 docker daemon 也能截断
    dateext
    dateformat -%Y%m%d-%s
}

# ---------- 2. 应用容器日志 (如果挂载了宿主机目录, 否则用上面 1 即可) ----------
/home/hyz/apartment-system/logs/*.log {
    daily
    rotate 7
    size 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
}

# ---------- 3. RocketMQ Broker 日志 ----------
# broker-logs volume 实际路径: /var/lib/docker/volumes/rocketmq-stack_broker-logs/_data
/var/lib/docker/volumes/rocketmq-stack_broker-logs/_data/**/*.log {
    weekly
    rotate 4
    size 200M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# ---------- 4. Nacos 日志 ----------
/var/lib/docker/volumes/nacos-cluster_nacos1-logs/_data/**/*.log
/var/lib/docker/volumes/nacos-cluster_nacos2-logs/_data/**/*.log
/var/lib/docker/volumes/nacos-cluster_nacos3-logs/_data/**/*.log
{
    weekly
    rotate 3
    size 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# ---------- 5. MySQL 慢查询日志 / 错误日志 (如果开启) ----------
/var/lib/docker/volumes/mysql-ha_mysql-ha-master-data/_data/*.log
/var/lib/docker/volumes/mysql-ha_mysql-ha-slave-data/_data/*.log
{
    monthly
    rotate 3
    size 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
