# ===== RocketMQ Broker 配置 =====
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# ===== 关键:broker 注册到 NameServer 的 IP =====
# 必须为宿主机外网 IP,否则客户端(包括 docker 内的 app 容器)拿到的
# 是 broker 容器内部 IP,会连接失败
brokerIP1=192.168.24.129
namesrvAddr=192.168.24.129:9876
listenPort=10911
